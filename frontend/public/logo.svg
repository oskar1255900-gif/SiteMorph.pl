<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
  </defs>
  <!-- Interlinked rounded shape - two overlapping rounded squares -->
  <rect x="12" y="28" width="68" height="68" rx="20" ry="20" fill="none" stroke="url(#lm)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="40" y="12" width="68" height="68" rx="20" ry="20" fill="none" stroke="url(#lm)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Code symbol -->
  <text x="60" y="70" font-family="monospace" font-size="24" font-weight="800" fill="url(#lm)" text-anchor="middle">&lt;/&gt;</text>
</svg>
